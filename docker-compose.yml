services:
  nginx:
    image: nginx:alpine
    container_name: nakis-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - db
      - blue
      - green

  blue:
    build: .
    container_name: nakis-blue
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    volumes:
      - ./prisma:/app/prisma
      - ./uploads:/app/uploads
      - ./public/images:/app/public/images
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.5

  green:
    build: .
    container_name: nakis-green
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    volumes:
      - ./prisma:/app/prisma
      - ./uploads:/app/uploads
      - ./public/images:/app/public/images
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.5
  db:
    image: postgres:alpine
    container_name: nakis-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nakis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
